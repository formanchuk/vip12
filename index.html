<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP.ua — Преміум 3D Бутик</title>
  <style>
    /* ===== ГЛОБАЛЬНІ СТИЛІ ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      cursor: default;
    }

    /* ===== 3D КОНТЕЙНЕР (фон) ===== */
    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none; /* щоб кліки проходили крізь фон */
    }

    /* ===== ОСНОВНИЙ КОНТЕНТ ===== */
    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      backdrop-filter: blur(2px);
    }

    /* ===== ЗАГОЛОВОК ===== */
    .hero {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeDown 1.2s ease-out;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 300;
      letter-spacing: 8px;
      text-shadow: 0 0 40px rgba(180, 130, 80, 0.3);
    }
    .hero h1 span {
      font-weight: 700;
      background: linear-gradient(135deg, #d4a373, #b8860b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero p {
      font-size: 1.2rem;
      opacity: 0.7;
      letter-spacing: 4px;
      margin-top: 10px;
    }

    /* ===== КАТЕГОРІЇ ===== */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-bottom: 70px;
      animation: fadeUp 1s ease-out 0.3s both;
    }
    .category-card {
      width: 180px;
      padding: 25px 15px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .category-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), 
                  rgba(255,215,140,0.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .category-card:hover {
      transform: translateY(-12px) scale(1.04);
      border-color: rgba(212, 163, 115, 0.5);
      box-shadow: 0 20px 60px rgba(212, 163, 115, 0.15);
    }
    .category-card:hover::before { opacity: 1; }
    .category-card .icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 15px rgba(212, 163, 115, 0.2));
    }
    .category-card h3 {
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 1.1rem;
    }
    .category-card .sub {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .category-card .sub span {
      background: rgba(255,255,255,0.06);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      letter-spacing: 1px;
      border: 1px solid rgba(255,255,255,0.05);
      transition: 0.3s;
    }
    .category-card .sub span:hover {
      background: rgba(212, 163, 115, 0.2);
      border-color: #d4a373;
    }

    /* ===== СІТКА ТОВАРІВ ===== */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      animation: fadeUp 1s ease-out 0.6s both;
    }

    .product-card {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 20px 15px 25px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      position: relative;
      text-align: center;
      overflow: hidden;
    }
    .product-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 28px;
      padding: 1px;
      background: conic-gradient(from var(--angle, 0deg), 
                  transparent 0%, rgba(212,163,115,0.3) 30%, transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: all 1s;
    }
    .product-card:hover {
      transform: translateY(-8px) scale(1.02);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 60px rgba(212,163,115,0.05);
    }
    .product-card:hover::after {
      --angle: 360deg;
      transition: all 3s linear;
    }
    .product-card .emoji {
      font-size: 4.5rem;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
      transition: 0.5s;
    }
    .product-card:hover .emoji {
      transform: scale(1.1) rotate(-3deg);
    }
    .product-card h4 {
      font-weight: 300;
      letter-spacing: 1px;
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .product-card .price {
      color: #d4a373;
      font-size: 1.2rem;
      font-weight: 600;
    }
    /* Динамічне світло на картці */
    .product-card .glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), 
                  rgba(212,163,115,0.08) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }
    .product-card:hover .glow { opacity: 1; }

    /* ===== АНІМАЦІЇ ===== */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 600px) {
      .category-card { width: 140px; padding: 18px; }
      .category-card .icon { font-size: 2.5rem; }
      .products { grid-template-columns: repeat(2, 1fr); gap: 15px; }
      .product-card { padding: 15px; }
      .product-card .emoji { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <!-- ===== 3D СЦЕНА (ФОН) ===== -->
  <div id="three-canvas"></div>

  <!-- ===== ОСНОВНИЙ КОНТЕНТ ===== -->
  <div class="app">

    <header class="hero">
      <h1>VIP.<span>ua</span></h1>
      <p>Шкіряні вироби преміум-класу</p>
    </header>

    <!-- Категорії -->
    <section class="categories">
      <div class="category-card" data-cat="bags">
        <span class="icon">👜</span>
        <h3>Сумки</h3>
        <div class="sub">
          <span>Жіночі</span>
          <span>Чоловічі</span>
          <span>Клатчі</span>
        </div>
      </div>
      <div class="category-card" data-cat="suitcases">
        <span class="icon">🧳</span>
        <h3>Валізи</h3>
        <div class="sub">
          <span>Ручна поклажа</span>
          <span>Великі</span>
          <span>Бізнес</span>
        </div>
      </div>
      <div class="category-card" data-cat="accessories">
        <span class="icon">⌚</span>
        <h3>Аксесуари</h3>
        <div class="sub">
          <span>Ремені</span>
          <span>Гаманці</span>
          <span>Портфелі</span>
        </div>
      </div>
    </section>

    <!-- Товари -->
    <section class="products" id="productGrid">
      <!-- Картки будуть додані JavaScript -->
    </section>

  </div>

  <!-- ===== ПІДКЛЮЧАЄМО THREE.JS ===== -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
      }
    }
  </script>

  <!-- ===== ГОЛОВНИЙ СКРИПТ ===== -->
  <script type="module">
    // ---------- ІМПОРТИ ----------
    import * as THREE from 'three';
    import { OrbitControls } from 'https://unpkg.com/three@0.126.0/examples/jsm/controls/OrbitControls.js';

    // ---------- 1. 3D СЦЕНА (ФОН) ----------
    const container = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    // Камера
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 10);
    camera.lookAt(0, 0, 0);

    // Рендерер
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Контролер (щоб можна було покрутити сцену мишкою, але вимкнемо для фону)
    // Тут не використовуємо, щоб не заважав

    // ---------- СВІТЛО ----------
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const backLight = new THREE.PointLight(0xd4a373, 0.8, 20);
    backLight.position.set(-3, 1, -5);
    scene.add(backLight);

    // ---------- 3D ОБ'ЄКТИ: ЛІТАЮЧІ ШКІРЯНІ КЛАПТІ ----------
    function createFloatingShape(geometry, color, pos, scale = 1) {
      const mat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.6,
        metalness: 0.1,
        emissive: color,
        emissiveIntensity: 0.05,
        transparent: true,
        opacity: 0.7
      });
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.position.set(pos.x, pos.y, pos.z);
      mesh.scale.set(scale, scale, scale);
      mesh.castShadow = true;
      mesh.userData = {
        speed: 0.2 + Math.random() * 0.3,
        rotSpeed: 0.005 + Math.random() * 0.01,
        offset: Math.random() * 100
      };
      scene.add(mesh);
      return mesh;
    }

    // Створюємо різні фігури
    const shapes = [];
    const colors = [0xd4a373, 0x8b6b4d, 0x2c1810, 0xb8860b, 0x4a3520];
    const geometries = [
      new THREE.BoxGeometry(0.6, 0.1, 0.4),
      new THREE.CylinderGeometry(0.3, 0.3, 0.1, 6),
      new THREE.SphereGeometry(0.25, 8, 8),
      new THREE.TorusGeometry(0.2, 0.08, 8, 12),
    ];

    for (let i = 0; i < 25; i++) {
      const geo = geometries[i % geometries.length];
      const col = colors[Math.floor(Math.random() * colors.length)];
      const pos = {
        x: (Math.random() - 0.5) * 12,
        y: (Math.random() - 0.5) * 8 + 1,
        z: (Math.random() - 0.5) * 8 - 3
      };
      const scale = 0.5 + Math.random() * 1.2;
      const mesh = createFloatingShape(geo, col, pos, scale);
      shapes.push(mesh);
    }

    // ---------- ЦЕНТРАЛЬНИЙ 3D-ЕЛЕМЕНТ (СУМКА-СИМВОЛ) ----------
    // Робимо просту композицію з геометрій, що нагадує сумку
    const bagGroup = new THREE.Group();
    bagGroup.position.set(0, 0.5, 0);

    // Корпус (основа)
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x3d2314,
      roughness: 0.4,
      metalness: 0.1,
      emissive: 0x2c1810,
      emissiveIntensity: 0.1
    });
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.8, 0.5), bodyMat);
    body.position.y = 0.1;
    body.castShadow = true;
    bagGroup.add(body);

    // Ручка (тор)
    const handleMat = new THREE.MeshStandardMaterial({
      color: 0x8b6b4d,
      roughness: 0.7,
      metalness: 0.05
    });
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.08, 8, 12), handleMat);
    handle.position.set(0, 0.5, 0);
    handle.rotation.x = Math.PI / 2;
    bagGroup.add(handle);

    // Блиск (маленька сфера)
    const glitter = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0xd4a373, emissive: 0xd4a373, emissiveIntensity: 0.8 })
    );
    glitter.position.set(0.5, 0.3, 0.3);
    bagGroup.add(glitter);

    scene.add(bagGroup);

    // ---------- МИШКА ДЛЯ СВІТЛА НА КАРТКАХ ----------
    document.querySelectorAll('.product-card, .category-card').forEach(el => {
      el.addEventListener('mousemove', (e) => {
        const rect = el.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        el.style.setProperty('--mx', x + '%');
        el.style.setProperty('--my', y + '%');
      });
    });

    // ---------- ГЕНЕРАЦІЯ ТОВАРІВ ----------
    const products = [
      { name: 'Класична сумка', emoji: '👜', price: '12 900 ₴' },
      { name: 'Дорожня валіза', emoji: '🧳', price: '18 500 ₴' },
      { name: 'Шкіряний портфель', emoji: '💼', price: '14 200 ₴' },
      { name: 'Клатч вечірній', emoji: '👝', price: '8 700 ₴' },
      { name: 'Ремінь натуральний', emoji: '🎀', price: '3 400 ₴' },
      { name: 'Гаманець преміум', emoji: '👛', price: '5 100 ₴' },
      { name: 'Сумка-месенджер', emoji: '🎒', price: '11 300 ₴' },
      { name: 'Валіза бізнес', emoji: '💎', price: '24 900 ₴' },
    ];

    const grid = document.getElementById('productGrid');
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="glow"></div>
        <span class="emoji">${p.emoji}</span>
        <h4>${p.name}</h4>
        <div class="price">${p.price}</div>
      `;
      grid.appendChild(card);
    });

    // ---------- АНІМАЦІЙНИЙ ЦИКЛ ----------
    let clock = new THREE.Clock();

    function animate() {
      const time = clock.getElapsedTime();

      // Рух літаючих фігур
      shapes.forEach((mesh, i) => {
        const data = mesh.userData;
        mesh.position.x += Math.sin(time * data.speed + data.offset) * 0.001;
        mesh.position.y += Math.cos(time * data.speed * 0.7 + data.offset) * 0.001;
        mesh.rotation.x += data.rotSpeed;
        mesh.rotation.y += data.rotSpeed * 0.7;
      });

      // Обертання сумки-символу
      bagGroup.rotation.y = Math.sin(time * 0.2) * 0.3;
      bagGroup.position.y = 0.5 + Math.sin(time * 0.5) * 0.1;

      // Рендер
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // ---------- АДАПТИВ ----------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- ДОДАТКОВИЙ ЕФЕКТ: МІНІ-ГРА "ПОТЯГНИ СУМКУ" ----------
    // (Спрощена версія: при кліку на товар з'являється сповіщення)
    document.querySelectorAll('.product-card').forEach((card, idx) => {
      card.addEventListener('click', () => {
        const name = card.querySelector('h4').innerText;
        // Проста "гра" - емуляція вибору
        card.style.transition = 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
        card.style.transform = 'scale(1.2) rotate(3deg)';
        card.style.boxShadow = '0 0 80px rgba(212,163,115,0.4)';
        setTimeout(() => {
          card.style.transform = '';
          card.style.boxShadow = '';
        }, 500);
        alert(`🎉 Ви обрали: ${name}! Цей товар додано до віртуальної вітрини.`);
      });
    });

    console.log('🚀 VIP.ua 3D Бутик завантажено! Все грає, світиться та літає.');
  </script>
</body>
</html>
